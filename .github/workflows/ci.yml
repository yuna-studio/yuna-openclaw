name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  # /re 코멘트가 PR에 달렸을 때만 실행하도록 필터
  check-re:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/re')
    runs-on: self-hosted
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve PR ref
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUM=${{ github.event.issue.number }}
            REF=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json headRefName -q '.headRefName')
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          fi

  bip:
    needs: check-re
    runs-on: self-hosted
    defaults:
      run:
        working-directory: bip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-re.outputs.ref }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  gajae-os:
    needs: check-re
    runs-on: self-hosted
    defaults:
      run:
        working-directory: gajae-os
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-re.outputs.ref }}

      - name: Install test dependencies
        run: pip3 install -r requirements-test.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v
